name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Both keys are optional - without them the app runs entirely on its
        # bundled offline demo catalog and Google Drive backup stays hidden.
        #
        # - TMDB_API_KEY: a repository *secret* (Settings -> Secrets and
        #   variables -> Actions -> Secrets). Enables live TMDB data for
        #   every visitor by default; a visitor can still override it with
        #   their own key from Settings.
        # - GOOGLE_CLIENT_ID: a repository *variable* (same page, Variables
        #   tab), not a secret - OAuth client IDs for browser apps are
        #   public by design and safe to expose in the built bundle. Enables
        #   the "Google Drive'a Yedekle" feature. See README for setup steps.
        env:
          VITE_TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
