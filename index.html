<!doctype html>
<html lang="tr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0b0d" />
    <script>
      // Applies the last-known theme synchronously, before first paint, so
      // returning users with "light" or "system -> light" never see a flash
      // of the dark default. The app defaults to dark (data-theme="dark"
      // on <html>, set above) until this or the in-app theme switch changes
      // it; settings themselves live in IndexedDB and are read later.
      (function () {
        try {
          var t = localStorage.getItem('movie-tracker-theme')
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t)
          } else if (t === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches) {
            document.documentElement.setAttribute('data-theme', 'light')
          }
        } catch (e) {}
      })()
    </script>
    <meta
      name="description"
      content="Movie Tracker: izlediğin film ve dizileri takip et, ilerlemeni gör, kendi kitaplığını yönet."
    />
    <title>Movie Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
